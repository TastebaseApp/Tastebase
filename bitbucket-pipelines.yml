# bitbucket-pipelines.yml
image: gradle:8.10.2-jdk11

pipelines:
  branches:
    main:
      # Step 1: Build and generate properties
      - step:
          name: Build Spring Boot App
          caches:
            - gradle
          script:
            # Export secrets from repository variables
            - export USE_ENV=true
            - export DB_PASSWORD=${DB_PASSWORD}
            - export DB_USER=${DB_USER}
            - export DB_URL=${DB_URL}
            - export SPN_KEY=${SPN_KEY}
            - export GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

            # Clean and build the JAR
            - ./gradlew clean bootJar

          artifacts:
            - build/libs/*.jar

      # Step 2: Deployment to staging environment
      - deployment: staging
        step:
          name: Deploy to Staging
          script:
            - echo "Deploying JAR to staging server..."
                SERVER: $STAGING_SERVER
                REMOTE_PATH: $STAGING_PATH
                LOCAL_PATH: "build/libs/*.jar"
