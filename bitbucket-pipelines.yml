# bitbucket-pipelines.yml
image: atlassian/default-image:3

pipelines:
  branches:
    dev:
      - step:
          name: Deploy to Staging (Fire & Forget)
          image: atlassian/default-image:3
          script:
            - echo "Triggering deployment on staging server..."
            - >
              ssh -o StrictHostKeyChecking=no $STAGING_USER@$STAGING_SERVER \
              "mkdir -p /home/tastebase/deploy_logs && \
               nohup sudo -u tastebase bash -l /home/tastebase/deploy.sh \
               > /home/tastebase/deploy_logs/deploy_$(date +%Y%m%d_%H%M%S).log 2>&1 &"
            - echo "Deployment triggered. Pipeline finished immediately."