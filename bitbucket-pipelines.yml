# bitbucket-pipelines.yml
image: gradle:8.10.2-jdk11

pipelines:
  branches:
    EWOK-86-automate-gradle-jar-deployment:
      - step:
          name: Build Spring Boot App
          caches:
            - gradle
          script:
            - cd backend
            # Export secrets from repository variables
            - export USE_ENV=true
            - export DB_PASSWORD=${DB_PASSWORD}
            - export DB_URL=${DB_URL}
            - export SPN_KEY=${SPN_KEY}
            - export GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

            # Build the JAR
            - gradle clean bootJar

          artifacts:
            - backend/build/libs/*.jar

      - step:
         name: Deploy to Staging
         deployment: staging
         script:
          - echo "Deploying JAR to staging server..."

          # Setup SSH
          - mkdir -p ~/.ssh
          - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          - ssh-keyscan -H $STAGING_SERVER >> ~/.ssh/known_hosts

          # Copy JAR to server
          - scp build/libs/*.jar $STAGING_USER@$STAGING_SERVER:/home/tastebase/tastebase.jar

          # Stop → replace → start service
          - ssh $STAGING_USER@$STAGING_SERVER << 'EOF'
            echo "Stopping tastebase service..."
            sudo systemctl stop tastebase
            
            echo "Starting tastebase service..."
            sudo systemctl start tastebase
            echo "Deployment complete."
            EOF
